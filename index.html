<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trevo Pastelaria | Cardápio</title><style>
:root{--g:#43f20c;--g2:#9cff19;--y:#ffd400;--bg:#070a07;--card:#111611;--mut:#b8c0b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#153615 0,#070a07 32%);color:#fff;font-family:Arial,sans-serif;padding-bottom:92px}.wrap{max-width:980px;margin:auto;padding:16px}.hero{display:flex;align-items:center;gap:16px;padding:8px 0 16px}.logo{width:120px;height:120px;border-radius:50%;object-fit:cover}.hero h1{margin:0;font-size:clamp(28px,6vw,48px);color:var(--g2)}.hero p{margin:6px 0;color:#eee}.chips{display:flex;gap:8px;overflow:auto;position:sticky;top:0;background:#070a07eF;padding:10px 0;z-index:5}.chip{border:1px solid #36d313;background:#101610;color:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap;cursor:pointer}.section h2{color:var(--y);border-bottom:2px solid var(--g);padding-bottom:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.item{background:linear-gradient(145deg,#141a14,#0b0f0b);border:1px solid #245c20;border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:12px}.item b{display:block}.desc{font-size:13px;color:var(--mut);margin-top:5px}.price{color:#111;background:var(--y);font-weight:900;padding:6px 9px;border-radius:9px;height:max-content;white-space:nowrap}.add{margin-top:10px;border:0;background:var(--g);font-weight:900;padding:8px 12px;border-radius:9px;cursor:pointer}.special{border-color:var(--y);box-shadow:0 0 18px #ffd40020}.cartbar{position:fixed;bottom:0;left:0;right:0;background:#101510;border-top:2px solid var(--g);padding:12px 16px;display:flex;justify-content:center;z-index:10}.cartbtn{width:min(940px,100%);background:#18c84b;color:#fff;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;overflow:auto}.panel{max-width:620px;margin:30px auto;background:#101510;border:1px solid #36d313;border-radius:20px;padding:18px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #283228;padding:10px 0}.qty button{width:30px;height:30px;border:0;border-radius:8px;font-weight:bold}.field{width:100%;margin:6px 0;padding:12px;border-radius:10px;border:1px solid #3a4a3a;background:#080b08;color:#fff}.total{font-size:22px;color:var(--y);font-weight:900}.actions{display:flex;gap:8px}.actions button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:900}.close{background:#333;color:#fff}.wa{background:#20c65a;color:#fff}.note{font-size:12px;color:#9ba69b;text-align:center;margin-top:12px}@media(max-width:560px){.logo{width:95px;height:95px}.wrap{padding:12px}.panel{margin:10px}}
</style></head><body><main class="wrap"><header class="hero"><img class="logo" src="a_clean_high_resolution_glossy_vector_cartoon_lo.png" alt="Trevo Pastelaria"><div><h1>Trevo Pastelaria</h1><p>🥟 Sabor, qualidade e tradição em cada mordida!</p><small>Monte seu pedido e finalize direto no WhatsApp.</small></div></header><nav class="chips"><button class="chip" onclick="go('frango')">Frango</button><button class="chip" onclick="go('carne')">Carne</button><button class="chip" onclick="go('especiais')">Sabores especiais</button><button class="chip" onclick="go('trevo')">⭐ Trevo</button><button class="chip" onclick="go('bebidas')">Bebidas</button></nav><div id="menu"></div></main><div class="cartbar"><button class="cartbtn" onclick="openCart()">🛒 Ver pedido • <span id="count">0</span> item(ns) • <span id="sum">R$ 0,00</span></button></div><div class="modal" id="modal"><div class="panel"><h2>Seu pedido 🥟</h2><div id="cart"></div><p class="total">Total: <span id="total">R$ 0,00</span></p><input class="field" id="nome" placeholder="Seu nome"><select class="field" id="tipo"><option>Retirada</option><option>Entrega</option></select><input class="field" id="endereco" placeholder="Endereço (se for entrega)"><select class="field" id="pag"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select><textarea class="field" id="obs" placeholder="Observações (ex.: sem cebola)"></textarea><div class="actions"><button class="close" onclick="closeCart()">Continuar escolhendo</button><button class="wa" onclick="send()">Enviar no WhatsApp</button></div><p class="note">O pedido só será enviado quando você confirmar no WhatsApp.</p></div></div><script>
const sections=[['frango','FRANGO',[[1,'Frango',14],[2,'Frango c/ milho',14.5],[3,'Frango c/ milho e catupiry',14.5],[4,'Frango c/ queijo',15],[5,'Frango c/ queijo e catupiry',15.5],[6,'Frango c/ catupiry',14],[7,'Frango c/ catupiry e cheddar',14.5],[8,'Frango c/ carne',16],[9,'Frango c/ queijo cheddar',15.5],[10,'Misto: queijo e presunto',14],[11,'Pizza','queijo, presunto, orégano e tomate',15],[12,'Calabresa c/ queijo',17.5],[13,'Portuguesa','queijo, presunto, calabresa, tomate, cebola e ovo',17]]],['carne','CARNE',[[14,'Carne',17],[15,'Carne do sol c/ banana e queijo',19],[16,'Carne c/ queijo',18],[17,'Carne c/ queijo e catupiry',18.5],[18,'Carne c/ queijo, catupiry e cheddar',18.5],[19,'Carne c/ cebola',17.5],[20,'Carne c/ cebola e tomate',17.5]]],['especiais','SABORES ESPECIAIS',[[21,'Romeu e Julieta',20],[22,'Queijo',24],[23,'Camarão',32],[24,'Camarão c/ queijo',30],[25,'Espanhola','queijo, presunto, calabresa e cebola',17.5],[26,'Tropical','queijo, frango, milho, ervilha, ovo e catupiry',17.5],[27,'Banana real',13]]],['trevo','⭐ SABOR ESPECIAL DA CASA',[[28,'Trevo','carne, frango, queijo, cebola, cheddar, catupiry, tomate, presunto, azeitona, milho, bacon, ovo, orégano e calabresa',19]]],['bebidas','BEBIDAS',[['B1','Pepsi 1LT',8],['B2','Refrigerante LT',6],['B3','Gob / refri',3]]]];
const cart={}; const br=n=>'R$ '+Number(n).toFixed(2).replace('.',',');
function parse(x){let [id,n,a,b]=x; return typeof a==='number'?{id,n,d:'',p:a}:{id,n,d:a,p:b}}
function render(){menu.innerHTML=sections.map(([id,title,items])=>`<section class="section" id="${id}"><h2>${title}</h2><div class="grid">${items.map(x=>{let o=parse(x);return `<article class="item ${id==='trevo'?'special':''}"><div><b>${typeof o.id==='number'?o.id+'. ':''}${o.n}</b>${o.d?`<div class="desc">${o.d}</div>`:''}<button class="add" onclick='add(${JSON.stringify(o)})'>+ Adicionar</button></div><span class="price">${br(o.p)}</span></article>`}).join('')}</div></section>`).join('')}
function add(o){cart[o.id]??={...o,q:0};cart[o.id].q++; update()}; function change(id,d){cart[id].q+=d;if(cart[id].q<=0)delete cart[id];draw();update()};function update(){let a=Object.values(cart),q=a.reduce((s,x)=>s+x.q,0),t=a.reduce((s,x)=>s+x.q*x.p,0);count.textContent=q;sum.textContent=br(t);total.textContent=br(t)}function draw(){let a=Object.values(cart);document.getElementById('cart').innerHTML=a.length?a.map(x=>`<div class="row"><div><b>${x.n}</b><small> ${br(x.p)}</small></div><div class="qty"><button onclick="change('${x.id}',-1)">−</button> ${x.q} <button onclick="change('${x.id}',1)">+</button></div></div>`).join(''):'Seu carrinho está vazio.'}function openCart(){draw();update();modal.style.display='block'}function closeCart(){modal.style.display='none'}function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}function send(){let a=Object.values(cart);if(!a.length)return alert('Adicione pelo menos um item.');let t=a.reduce((s,x)=>s+x.q*x.p,0);let msg=`🥟 *NOVO PEDIDO — TREVO PASTELARIA*\n\n${a.map(x=>`${x.q}x ${x.n} — ${br(x.q*x.p)}`).join('\n')}\n\n*Total: ${br(t)}*\n\n*Cliente:* ${nome.value||'-'}\n*Tipo:* ${tipo.value}\n*Endereço:* ${endereco.value||'-'}\n*Pagamento:* ${pag.value}\n*Observações:* ${obs.value||'Nenhuma'}`;location.href='https://wa.me/5571992727731?text='+encodeURIComponent(msg)}render();update();
</script></body></html>
